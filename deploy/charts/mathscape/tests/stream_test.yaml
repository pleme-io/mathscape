suite: stream writer tests
templates:
  - templates/stream.yaml
release:
  name: ms
  namespace: mathscape
tests:
  - it: renders nothing while the stream is off
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses to render without a seed
    set:
      stream.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "stream.enabled requires stream.seed"

  - it: refuses a seed that is not a non-negative integer
    set:
      stream.enabled: true
      stream.seed: "forty-two"
    asserts:
      - failedTemplate:
          errorPattern: "a non-negative integer"

  - it: renders one writer StatefulSet with its own selector
    set:
      stream.enabled: true
      stream.seed: "42"
    documentIndex: 0
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: ms-mathscape-stream
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: mathscape-stream
            app.kubernetes.io/instance: ms
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: stream
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 10

  - it: hands the seed, data dir and health address to the binary
    set:
      stream.enabled: true
      stream.seed: "42"
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MATHSCAPE_STREAM__SEED
            value: "42"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MATHSCAPE_STREAM__DATA_DIR
            value: /data/stream
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MATHSCAPE_STREAM__HEALTH_ADDR
            value: "0.0.0.0:9473"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MATHSCAPE_STREAM__UNTIL_EPOCH
          any: true

  - it: passes an epoch bound and further settings as stream env
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.untilEpoch: 5000
      stream.config:
        snapshot_every: 8
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MATHSCAPE_STREAM__UNTIL_EPOCH
            value: "5000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MATHSCAPE_STREAM__SNAPSHOT_EVERY
            value: "8"

  - it: probes the health port the binary serves
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.health.port: 9500
      stream.health.bindAddress: 127.0.0.1
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: health
              containerPort: 9500
              protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MATHSCAPE_STREAM__HEALTH_ADDR
            value: "127.0.0.1:9500"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /readyz
            port: health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet
          value:
            path: /readyz
            port: health

  - it: sizes the writer from its measured run
    set:
      stream.enabled: true
      stream.seed: "42"
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 768Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi

  - it: keeps the model on a claim by default
    set:
      stream.enabled: true
      stream.seed: "42"
    documentIndex: 0
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: model
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 2Gi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: model
            mountPath: /data
      - isNull:
          path: spec.template.spec.volumes

  - it: sets the claim's size and class
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.storage.size: 8Gi
      stream.storage.storageClass: fast
    documentIndex: 0
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 8Gi
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: fast

  - it: mounts a host directory at itself
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.storage.kind: hostPath
      stream.storage.path: /Users/op/.local/share/mathscape
      stream.dataDir: /Users/op/.local/share/mathscape/stream
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: model
              hostPath:
                path: /Users/op/.local/share/mathscape
                type: DirectoryOrCreate
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: model
            mountPath: /Users/op/.local/share/mathscape
      - isNull:
          path: spec.volumeClaimTemplates

  - it: refuses a host directory that is not named
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.storage.kind: hostPath
    asserts:
      - failedTemplate:
          errorPattern: "requires stream.storage.path"

  - it: refuses a relative host directory
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.storage.kind: hostPath
      stream.storage.path: data/mathscape
      stream.dataDir: data/mathscape/stream
    asserts:
      - failedTemplate:
          errorPattern: "must be absolute"

  - it: refuses a data dir outside the storage mount
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.dataDir: /tmp/stream
    asserts:
      - failedTemplate:
          errorPattern: "must lie under the storage mount"

  - it: refuses a sibling path that only shares the mount's prefix
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.dataDir: /data-other/stream
    asserts:
      - failedTemplate:
          errorPattern: "must lie under the storage mount"

  - it: refuses an unknown storage kind
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.storage.kind: emptyDir
    asserts:
      - failedTemplate:
          errorPattern: "must be claimTemplate or hostPath"

  - it: uses the engine image unless the writer names its own
    set:
      stream.enabled: true
      stream.seed: "42"
      image.repository: ghcr.io/pleme-io/mathscape
      image.tag: v1
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/pleme-io/mathscape:v1
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/bin/mathscape-stream"]

  - it: runs a Nix closure with no command so the runtime infers it
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.image.repository: nix:/nix/store/abc-mathscape-stream
      stream.image.tag: closure
      stream.command: []
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: nix:/nix/store/abc-mathscape-stream:closure
      - isNull:
          path: spec.template.spec.containers[0].command

  - it: renders no alert, scrape or band objects by default
    set:
      stream.enabled: true
      stream.seed: "42"
    asserts:
      - hasDocuments:
          count: 1

  - it: renders the writer's alert rules
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.alerts.enabled: true
      stream.alerts.stalledMinutes: 30
    documentIndex: 1
    asserts:
      - isKind:
          of: VMRule
      - equal:
          path: metadata.name
          value: ms-mathscape-stream
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4
      - equal:
          path: spec.groups[0].rules[0].alert
          value: MathscapeStreamDown
      - equal:
          path: spec.groups[0].rules[1].alert
          value: MathscapeStreamStalled
      - equal:
          path: spec.groups[0].rules[2].alert
          value: MathscapeStreamSnapshotStale
      - equal:
          path: spec.groups[0].rules[3].alert
          value: MathscapeStreamPlateau
      - matchRegex:
          path: spec.groups[0].rules[1].expr
          pattern: 'mathscape_stream_last_epoch_timestamp_seconds\{namespace="mathscape",seed="42"\} > 1800'
      - equal:
          path: spec.groups[0].rules[3].labels.severity
          value: info

  - it: scrapes the writer's metrics port
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.scrape.enabled: true
    documentIndex: 1
    asserts:
      - isKind:
          of: VMPodScrape
      - equal:
          path: spec.podMetricsEndpoints[0].port
          value: health
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: mathscape-stream

  - it: bands the writer's StatefulSet, never the engine
    set:
      stream.enabled: true
      stream.seed: "42"
      stream.breathe.enabled: true
    documentIndex: 1
    asserts:
      - isKind:
          of: MemoryBand
      - equal:
          path: spec.targetRef
          value:
            apiVersion: apps/v1
            kind: StatefulSet
            name: ms-mathscape-stream
      - equal:
          path: spec.floor
          value: 768Mi
