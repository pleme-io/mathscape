# mathscape — Evolutionary symbolic compression engine
# Defaults for single-replica StatefulSet with persistent storage.
# Serves REST + GraphQL + gRPC APIs and frontend static files.

image:
  # -- Image repository (set at deploy time via HelmRelease patches)
  repository: ""
  # -- Image tag
  tag: latest
  # -- Image pull policy
  pullPolicy: Always

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Number of replicas (single replica — deterministic engine)
replicaCount: 1

# -- Container ports
ports:
  - name: http
    containerPort: 8080
    protocol: TCP
  - name: grpc
    containerPort: 8081
    protocol: TCP
  - name: metrics
    containerPort: 9090
    protocol: TCP

# -- Service configuration
service:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8081
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

# -- Environment variables
env:
  - name: RUST_LOG
    value: "info,mathscape=debug"
  - name: MATHSCAPE_PERSISTENT_PATH
    value: "/data/registry.redb"
  - name: LOG_FORMAT
    value: "json"
  - name: MATHSCAPE_DATABASE__URL
    valueFrom:
      secretKeyRef:
        name: mathscape-db
        key: DATABASE_URL

# -- The engine (mathscape-service) StatefulSet, its Services, ServiceMonitor, NetworkPolicy and PDB
engine:
  # -- Render the engine; off leaves only what other blocks enable (e.g. the stream writer alone)
  enabled: true

# -- Stream writer (mathscape-stream), the one writer of the canonical model.
# With enabled: true it is its own single-replica StatefulSet (<fullname>-stream).
# With enabled: false and a seed, the seed env is injected into the engine container instead (pair with command: ["/bin/mathscape-stream"]).
stream:
  # -- Render the dedicated stream StatefulSet; requires a seed
  enabled: false
  # -- Seed of the one model, as a string (a stream never changes seed; there is no default)
  seed: ""
  # -- Where objects/, HEAD and deltas.lisp live; must lie under the storage mount
  dataDir: /data/stream
  # -- Epoch to stop at; empty runs without a bound
  untilEpoch: ""
  # -- Image for the writer; empty repository uses image.*
  image:
    repository: ""
    tag: ""
  # -- Container command; [] lets the runtime infer it (a Nix closure whose bin/ holds one executable)
  command: ["/bin/mathscape-stream"]
  # -- RUST_LOG for the writer
  rustLog: "info,egg=warn"
  # -- Further stream settings as MATHSCAPE_STREAM__<KEY> env, e.g. {SNAPSHOT_EVERY: "8"}
  config: {}
  # -- Health and metrics endpoint (/healthz, /readyz, /metrics)
  health:
    # -- Port the writer serves on; also the probe and scrape port
    port: 9473
    # -- Address it binds; 127.0.0.1 on a node whose pods are host processes
    bindAddress: "0.0.0.0"
    livenessPeriod: 20
    livenessFailureThreshold: 3
    readinessPeriod: 10
    # -- Seconds the writer may take to open HEAD before liveness applies
    startupFailureThreshold: 60
    startupPeriod: 5
  # -- Where the model lives
  storage:
    # -- claimTemplate (a PVC per replica) or hostPath (a host directory mounted at itself)
    kind: claimTemplate
    # -- Mount path for claimTemplate; ignored for hostPath, which mounts path at itself
    mountPath: /data
    # -- PVC size for claimTemplate
    size: 2Gi
    # -- Storage class for claimTemplate (empty uses the cluster default)
    storageClass: ""
    # -- Host directory for hostPath; required for that kind, and dataDir must lie under it
    path: ""
  # -- One core: the epoch loop is single-threaded (measured 0.93-0.97 of a core). Memory is bounded by the motor's
  # corpus node budget (stream.corpus_max_nodes, 2048): over 65 min (2026-10-16, seeds 7 and 2026) the default mechanism
  # peaked at 526Mi and v0.1.8 at 119Mi. A size-8 trial frontier alone is ~680Mi, so the limit is 2Gi.
  resources:
    requests:
      cpu: 1000m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  # -- SIGTERM to SIGKILL; writes are atomic, so a kill only replays epochs since HEAD
  terminationGracePeriodSeconds: 10
  # -- Node selector for the writer
  nodeSelector: {}
  # -- Alert rules (VMRule) for the writer
  alerts:
    enabled: false
    # -- Minutes with no completed epoch before MathscapeStreamStalled
    stalledMinutes: 15
    # -- Minutes HEAD may stay unmoved before MathscapeStreamSnapshotStale
    snapshotStaleMinutes: 120
    # -- Hours with no certification before MathscapeStreamPlateau (info)
    plateauHours: 6
  # -- VMPodScrape of the writer's /metrics
  scrape:
    enabled: false
    interval: 30s
  # -- breathe bands on the writer's StatefulSet (pleme-lib.breatheBand); memory only, CPU stays pinned
  breathe:
    enabled: false
    memory:
      floor: 768Mi
      ceiling: 2Gi
    cpu:
      enabled: false

# -- Environment variables from ConfigMaps/Secrets
envFrom: []

# -- Resource requests and limits (computation-heavy workload)
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# -- Persistent storage configuration (redb expression store only — metadata is in PostgreSQL)
persistence:
  # -- Enable persistent storage
  enabled: true
  # -- Storage size for redb expression database
  size: 10Gi
  # -- Storage class (empty string uses cluster default)
  storageClass: ""
  # -- Mount path inside the container
  mountPath: /data
  # -- Access modes for the PVC
  accessModes:
    - ReadWriteOnce

# -- Health check configuration
health:
  # -- Liveness probe path
  path: /healthz
  # -- Readiness probe path
  readyPath: /readyz
  # -- Port name for probes
  port: http
  livenessInitialDelay: 5
  livenessPeriod: 10
  livenessFailureThreshold: 3
  readinessInitialDelay: 5
  readinessPeriod: 5
  readinessFailureThreshold: 2

# -- Monitoring configuration
monitoring:
  # -- Enable ServiceMonitor creation
  enabled: true
  # -- Metrics port name
  port: metrics
  # -- Metrics path
  path: /metrics
  # -- Scrape interval
  interval: 30s
  # -- Scrape timeout
  scrapeTimeout: 10s

# -- NetworkPolicy configuration
networkPolicy:
  # -- Enable NetworkPolicy creation
  enabled: true
  # -- Allow ingress from Prometheus for scraping
  allowPrometheus: true
  # -- Allow DNS egress
  allowDns: true
  # -- Additional ingress rules
  additionalIngress: []
  # -- Additional egress rules (e.g., PostgreSQL)
  additionalEgress: []

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Service account configuration
serviceAccount:
  # -- Create a service account
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Name override (defaults to fullname)
  name: ""

# -- PodDisruptionBudget configuration (disabled by default — single replica)
pdb:
  enabled: false
  minAvailable: 1

# -- Termination grace period
terminationGracePeriodSeconds: 30

# -- Pod annotations
podAnnotations: {}

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Topology spread constraints
topologySpreadConstraints: []

# -- Priority class name
priorityClassName: ""

# -- Container command override
command: []

# -- Container args override
args: []

# -- Additional labels for all resources
additionalLabels: {}

# -- Resource-level annotations
annotations: {}

# -- ConfigMaps to create
configMaps: []

# -- Downward API environment variables (POD_NAME, POD_NAMESPACE, NODE_NAME)
downwardApi:
  enabled: false

# -- Startup probe configuration (disabled by default)
startupProbe:
  enabled: false
  path: /healthz
  port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  failureThreshold: 30

# -- Istio sidecar configuration
istio:
  enabled: false

# -- Attestation framework integration
attestation:
  enabled: false
